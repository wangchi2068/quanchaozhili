<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>《全巢之力》配图</title>
<style>
  :root { --ink:#efe4d2; --dim:#9d907c; --bg:#070a12; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:"Noto Serif SC","Songti SC",serif; }
  header { padding:56px 32px 8px; text-align:center; }
  header h1 { margin:0; font-size:34px; letter-spacing:14px; font-weight:500; }
  header p { margin:14px 0 0; color:var(--dim); font-size:13px; letter-spacing:4px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(420px,1fr));
          gap:26px; padding:36px 32px 72px; max-width:1680px; margin:0 auto; }
  figure { margin:0; background:#0c1120; border:1px solid #1e2331; border-radius:14px; overflow:hidden; }
  figure img { display:block; width:100%; height:auto; }
  figcaption { padding:12px 16px; font-size:13px; color:var(--dim); letter-spacing:2px;
               display:flex; justify-content:space-between; gap:12px; }
  figcaption b { color:var(--ink); font-weight:500; }
</style>
</head>
<body>
<header>
  <h1>全巢之力</h1>
  <p>HOW HEAVY THE WHOLE NEST · 配图画廊</p>
</header>
<div class="grid">
  <figure><img src="cover.svg" alt="封面"><figcaption><b>封面 · 法阵与缺笔的名字</b><span>cover.svg</span></figcaption></figure>
  <figure><img src="act1.svg" alt="第一幕·显灵"><figcaption><b>第一幕 · 显灵</b><span>act1.svg</span></figcaption></figure>
  <figure><img src="act2.svg" alt="第二幕·应许"><figcaption><b>第二幕 · 应许</b><span>act2.svg</span></figcaption></figure>
  <figure><img src="act3.svg" alt="第三幕·狂热"><figcaption><b>第三幕 · 狂热</b><span>act3.svg</span></figcaption></figure>
  <figure><img src="act4.svg" alt="第四幕·求爱者"><figcaption><b>第四幕 · 求爱者</b><span>act4.svg</span></figcaption></figure>
  <figure><img src="act5.svg" alt="第五幕·开水"><figcaption><b>第五幕 · 开水</b><span>act5.svg</span></figcaption></figure>
  <figure><img src="act6.svg" alt="第六幕·新世代"><figcaption><b>第六幕 · 新世代</b><span>act6.svg</span></figcaption></figure>
  <figure><img src="cast.svg" alt="人物图谱"><figcaption><b>人物图谱 · 七只蚂蚁</b><span>cast.svg</span></figcaption></figure>
  <figure><img src="rune.svg" alt="法阵纹样"><figcaption><b>法阵纹样</b><span>rune.svg</span></figcaption></figure>
</div>
</body>
</html>
